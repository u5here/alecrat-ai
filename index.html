<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alecrat.ai</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0e0e0e; --surface: #161616; --border: #2a2a2a; --text: #e8e8e8; --muted: #666; }
    body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: flex; flex-direction: column; align-items: center; }
    .app { width: 100%; max-width: 720px; height: 100dvh; display: flex; flex-direction: column; }
    .topbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px; }
    .topbar h1 { font-size: 15px; font-weight: 400; }
    .topbar span { font-size: 11px; color: var(--muted); }
    .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
    .msg { display: flex; gap: 12px; animation: fadeUp .25s ease; }
    .msg.user { flex-direction: row-reverse; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; } }
    .label { font-size: 10px; color: var(--muted); white-space: nowrap; padding-top: 4px; min-width: 24px; }
    .msg.user .label { text-align: right; }
    .bubble { padding: 10px 14px; border-radius: 6px; font-size: 13px; line-height: 1.7; max-width: 88%; border: 1px solid var(--border); }
    .msg.ai .bubble { background: #161616; border-radius: 2px 8px 8px 8px; }
    .msg.user .bubble { background: #1e1e1e; border-radius: 8px 2px 8px 8px; }
    .bubble pre { background: #0a0a0a; border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
    .bubble code { background: #0a0a0a; border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 12px; }
    .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: bounce 1.1s infinite; }
    .dot:nth-child(2) { animation-delay: .18s; }
    .dot:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
    .chips { padding: 0 20px 10px; display: flex; gap: 7px; flex-wrap: wrap; }
    .chip { font-size: 11px; padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'Courier New', monospace; transition: all .15s; }
    .chip:hover { color: var(--text); border-color: #444; }
    .input-area { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; align-items: flex-end; gap: 10px; background: var(--surface); }
    .prompt { font-size: 15px; color: var(--muted); padding-bottom: 5px; }
    textarea { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-family: 'Courier New', monospace; font-size: 13px; resize: none; height: 22px; max-height: 100px; line-height: 1.6; }
    textarea::placeholder { color: var(--muted); }
    .send { width: 30px; height: 30px; border-radius: 4px; background: var(--text); color: var(--bg); border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: opacity .15s; flex-shrink: 0; }
    .send:hover { opacity: .75; }
    .send:disabled { opacity: .3; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar"><h1>alecrat.ai</h1><span>// senior dev assistant</span></div>
  <div class="messages" id="messages">
    <div class="msg ai"><div class="label">ai</div><div class="bubble">Hola Alecrat. Sin rodeos, sin disclaimers innecesarios.<br><br>Codigo, arquitectura, seguridad, debugging — lo que necesites.</div></div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" onclick="sendChip(this)">Review mi codigo</button>
    <button class="chip" onclick="sendChip(this)">SQL injection</button>
    <button class="chip" onclick="sendChip(this)">Arquitectura</button>
    <button class="chip" onclick="sendChip(this)">Trucos produccion</button>
  </div>
  <div class="input-area">
    <div class="prompt">›</div>
    <textarea id="inp" placeholder="pregunta algo..." rows="1"></textarea>
    <button class="send" id="sendBtn" onclick="send()">↑</button>
  </div>
</div>
<script>
const APIKEY='TU_API_KEY_AQUI';
const msgs=document.getElementById('messages'),inp=document.getElementById('inp'),btn=document.getElementById('sendBtn'),chips=document.getElementById('chips');
let hist=[],busy=false;
const SYS='Eres la IA personal de Alecrat, programador senior 20+ anos. Directo, sin disclaimers. Explicas seguridad tecnicamente. Respondes en el mismo idioma del usuario. Formateas codigo con bloques.';
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
inp.addEventListener('input',()=>{inp.style.height='22px';inp.style.height=Math.min(inp.scrollHeight,100)+'px';});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(t){return t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>'<pre>'+esc(c.trim())+'</pre>').replace(/`([^`]+)`/g,(_,c)=>'<code>'+esc(c)+'</code>').replace(/\n/g,'<br>');}
function addMsg(text,role){const w=document.createElement('div');w.className='msg '+role;const l=document.createElement('div');l.className='label';l.textContent=role==='ai'?'ai':'tu';const b=document.createElement('div');b.className='bubble';b.innerHTML=fmt(text);w.appendChild(l);w.appendChild(b);msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;}
function addTyping(){const w=document.createElement('div');w.className='msg ai';w.id='typing';const l=document.createElement('div');l.className='label';l.textContent='ai';const b=document.createElement('div');b.className='bubble typing';b.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';w.appendChild(l);w.appendChild(b);msgs.appendChild(w);msgs.scrollTop=msgs.scrollHeight;}
function rmTyping(){document.getElementById('typing')?.remove();}
function sendChip(b){inp.value=b.textContent;chips.style.display='none';send();}
async function send(){const text=inp.value.trim();if(!text||busy)return;busy=true;btn.disabled=true;chips.style.display='none';addMsg(text,'user');hist.push({role:'user',content:text});inp.value='';inp.style.height='22px';addTyping();try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':APIKEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYS,messages:hist})});const d=await r.json();rmTyping();const rep=d.content?.map(b=>b.text||'').join('')||'Error.';hist.push({role:'assistant',content:rep});addMsg(rep,'ai');}catch(e){rmTyping();addMsg('Error de conexion.','ai');}busy=false;btn.disabled=false;inp.focus();}
</script>
</body>
</html>
